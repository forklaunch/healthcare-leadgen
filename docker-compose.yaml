        condition: service_healthy
    ports:
    - '3200:3200'
    - '4317:4317'
    networks:
    - uchicago-ideas-network
    volumes:
    - './src/modules/monitoring/tempo.yaml:/etc/tempo.yaml'
    command: '-target=all -config.file=/etc/tempo.yaml'
    healthcheck:
      test:
      - CMD
      - wget
      - '--no-verbose'
      - '--tries=1'
      - '--spider'
